version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carbonwise
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev -d carbonwise']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dev:devpass@postgres:5432/carbonwise
      JWT_SECRET: dev-secret-must-be-at-least-32-characters-long
      JWT_REFRESH_SECRET: dev-refresh-secret-must-be-at-least-32-chars
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      PORT: 3001
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5173
      GEMINI_API_KEY: ''
      RESEND_API_KEY: ''
      EMAIL_FROM: noreply@carbonwise.app

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - '5173:80'
    depends_on:
      - server

volumes:
  pgdata:
